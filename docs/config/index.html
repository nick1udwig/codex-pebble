<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Codex Jobs Config</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="page">
      <header class="masthead">
        <p class="eyebrow">Codex Jobs</p>
        <h1>Config</h1>
      </header>

      <section class="panel">
        <form id="settings-form" novalidate>
          <label for="wsUrl">Codex relay WebSocket URL</label>
          <input id="wsUrl" name="wsUrl" type="text" inputmode="url" placeholder="ws://relay-host:4501/?token=..." required />
          <p class="hint">Use the origin relay URL. The relay forwards to Codex app-server without storing credentials.</p>

          <label for="displayLimit">Dashboard rows</label>
          <input id="displayLimit" name="displayLimit" type="number" min="1" max="8" step="1" />

          <label for="recentCompletionLookbackMinutes">Recent completion lookback</label>
          <div class="field-row">
            <input id="recentCompletionLookbackMinutes" name="recentCompletionLookbackMinutes" type="number" min="5" max="10080" step="5" />
            <span>minutes</span>
          </div>

          <button id="save-settings" class="primary" type="submit">Save Settings</button>
          <p id="status-banner" class="status">Idle</p>
        </form>
      </section>
    </main>

    <script type="module" src="./app.js?v=20260609-return-to"></script>
  </body>
</html>
